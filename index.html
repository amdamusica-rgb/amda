<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMDA DJ PRO - SPECTRUM KALEM</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:system-ui}
.box{background:#1a1a1a;border-radius:12px;padding:10px;margin:8px;border:1px solid #333}
input[type=text]{width:100%;padding:12px;background:#000;color:#0f0;border:1px solid #0f0;border-radius:8px}
.btn{width:100%;padding:14px;border:none;border-radius:8px;font-weight:900;font-size:16px;margin-top:8px}
.yt{background:#0f0;color:#000}
.add{background:#ffeb00;color:#000}
.eqbtn{background:#00f0f0;color:#000}
.playlist-item{background:#00f0f0;color:#000;padding:10px;border-radius:6px;margin-top:6px;display:flex;justify-content:space-between;font-weight:700}
canvas{width:100%;background:#000;border-radius:8px;border:2px solid #00f0f0;display:block}
</style>
</head>
<body>
<div class="box">
<input id="ytLink" type="text" placeholder="Link YT: youtu.be/xxxx">
<button class="btn yt" onclick="playYT()">▶️ YT</button>
<div id="ytPlayer" style="margin-top:8px;display:none"></div>
</div>
<div class="box">
<input type="file" id="fileInput" multiple accept="audio/*" style="width:100%;padding:8px;background:#000;color:#fff;border-radius:8px">
<button class="btn add" onclick="tambahLagu()">➕ TAMBAH LAGU</button>
<audio id="audio" controls style="width:100%;margin-top:10px"></audio>
<button class="btn eqbtn" id="eqBtn" onclick="toggleEQ()">🎛️ EQ ON ✅</button>
<div id="playlist"></div>
<div style="text-align:center;color:#0f0;margin-top:8px;font-weight:900" id="count">0 lagu</div>
</div>
<div class="box">
<canvas id="spectrum" height="140"></canvas>
<canvas id="eqGraph" height="200" style="margin-top:8px;background:#111"></canvas>
<div style="display:flex;gap:8px;margin-top:8px">
<button class="btn" style="flex:1;background:#333;color:#aaa" onclick="setFlat()">FLAT</button>
<button class="btn" style="flex:1;background:#00f0f0;color:#000" onclick="setBass()">BASS</button>
</div>
</div>
<script>
let songs=[],audio=document.getElementById('audio'),fileInput=document.getElementById('fileInput');
let audioCtx,analyser,source,filters=[];
let eqValues=[6,4,-1,-4,1];const freqs=[60,230,910,3600,14000];
const cSpec=document.getElementById('spectrum'),ctxSpec=cSpec.getContext
